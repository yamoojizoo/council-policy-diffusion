  const X=v=>P.l+v*(W-P.l-P.r);[0,.25,.5,.75,1].forEach(v=>{svg.appendChild(sv("line",{x1:X(v),x2:X(v),y1:4,y2:H-22,stroke:"var(--grid)"}));svg.appendChild(sv("text",{x:X(v),y:H-6,"text-anchor":"middle"},v.toFixed(2)));});
  data.forEach((d,k)=>{const y=6+k*rowH;svg.appendChild(sv("text",{x:P.l-8,y:y+14,"text-anchor":"end",style:"fill:var(--text-primary);font-size:12px"},d.name));
    const w=Math.max(4,X(d.score)-P.l);svg.appendChild(sv("path",{d:`M${P.l},${y+4} H${P.l+w-4} Q${P.l+w},${y+4} ${P.l+w},${y+8} V${y+14} Q${P.l+w},${y+18} ${P.l+w-4},${y+18} H${P.l} Z`,fill:"var(--s1)"}));
    svg.appendChild(sv("text",{x:P.l+w+6,y:y+15},`${d.score.toFixed(2)} · 최초 ${d.origin}건`));
    const hit=sv("rect",{x:0,y,width:W,height:rowH,fill:"transparent"});hover(hit,()=>[`${d.score.toFixed(3)}`,d.name,`참여 이슈 ${d.n}개 · 최초 관측 ${d.origin}건`]);svg.appendChild(hit);});
  c.appendChild(svg);const t=el("table");const th=el("tr");["의회","혁신성 점수","참여 이슈","최초 관측"].forEach((h,j)=>th.appendChild(el("th",{class:j?"num":""},h)));t.appendChild(th);
  data.forEach(d=>{const tr=el("tr");[d.name,d.score.toFixed(3),d.n,d.origin].forEach((v,j)=>tr.appendChild(el("td",{class:j?"num":""},String(v))));t.appendChild(tr);});
  const det=el("details");det.appendChild(el("summary",{class:"sub"},"표로 보기"));det.appendChild(t);c.appendChild(det);sec.appendChild(c);}
// ---- model tab
function renderModel(){const sec=$("#tab-model");sec.replaceChildren();const m=D.metrics;
  const c=card("확산 예측 모델 검증","시점 이동(rolling-origin) 백테스트 · 각 검증 시점의 모델은 학습 라벨 기간이 검증 시점 이전에 끝난 표본만으로 학습(미래 정보 누수 방지)");
  if(m.folds){const t=el("table");const h=el("tr");["검증 기준일","ROC-AUC","상위 10% 정밀도","기저 확산률","무작위 대비","표본 수"].forEach((x,j)=>h.appendChild(el("th",{class:j?"num":""},x)));t.appendChild(h);
    m.folds.forEach(f=>{const r=el("tr");[f.cutoff,f.roc_auc.toFixed(3),f.precision_at_top10pct.toFixed(3),f.pos_rate.toFixed(3),(f.precision_at_top10pct/f.pos_rate).toFixed(1)+"배",f.n.toLocaleString()].forEach((v,j)=>r.appendChild(el("td",{class:j?"num":""},v)));t.appendChild(r);});
    const r=el("tr");["평균",m.roc_auc.toFixed(3),m.precision_at_top10pct.toFixed(3),m.pos_rate.toFixed(3),(m.precision_at_top10pct/m.pos_rate).toFixed(1)+"배",""].forEach((v,j)=>{const td=el("td",{class:j?"num":""},v);td.style.fontWeight="600";r.appendChild(td);});t.appendChild(r);c.appendChild(t);
    if(m.ordinance_issues){const o=m.ordinance_issues;c.appendChild(el("div",{class:"callout"},`조례 이슈 한정: ROC-AUC ${o.roc_auc.toFixed(3)}, 상위 10% 정밀도 ${o.precision_at_top10pct.toFixed(3)} (기저 ${o.pos_rate.toFixed(3)}, 약 ${(o.precision_at_top10pct/o.pos_rate).toFixed(1)}배)`));}}
  sec.appendChild(c);
  const w=Object.entries(D.weights).sort((a,b)=>b[1]-a[1]);if(!w.length)return;
  const c2=card("특징별 계수 (표준화 로지스틱 회귀)","양수 = 확산 가능성을 높이는 방향 · 음수 = 낮추는 방향 · 특징 간 상관이 있어 개별 계수는 다른 특징을 통제한 효과로 해석");
  const W=640,rowH=26,P={l:220,r:70},H=w.length*rowH+10,mx=Math.max(...w.map(x=>Math.abs(x[1])));const X=v=>P.l+(v+mx)/(2*mx)*(W-P.l-P.r);
  const svg=sv("svg",{viewBox:`0 0 ${W} ${H}`,width:"100%",role:"img","aria-label":"특징별 계수",style:"max-width:760px"});svg.appendChild(sv("line",{x1:X(0),x2:X(0),y1:2,y2:H-4,stroke:"var(--axis)"}));
  w.forEach(([k,v],j)=>{const y=4+j*rowH;svg.appendChild(sv("text",{x:P.l-10,y:y+14,"text-anchor":"end",style:"fill:var(--text-primary);font-size:12px"},k));
    const x0=Math.min(X(0),X(v)),wd=Math.max(2,Math.abs(X(v)-X(0)));svg.appendChild(sv("rect",{x:x0,y:y+4,width:wd,height:14,rx:3,fill:v>=0?"var(--div-pos)":"var(--div-neg)"}));
    svg.appendChild(sv("text",{x:W-4,y:y+15,"text-anchor":"end",style:"font-variant-numeric:tabular-nums"},(v>0?"+":"")+v.toFixed(3)));
    const hit=sv("rect",{x:0,y,width:W,height:rowH,fill:"transparent"});hover(hit,()=>[v.toFixed(3),k]);svg.appendChild(hit);});
  c2.appendChild(svg);sec.appendChild(c2);}
function render(){renderList();renderDetail();renderInno();renderModel();}
render();
